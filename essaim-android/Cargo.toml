[package]
name = "essaim"
version = "1.0.0"
edition = "2021"
description = "Essaim : un essaim de bestioles (boids de Reynolds) traque ton doigt. Trace des murs, referme des formes pour les piéger."

[dependencies]
macroquad = { version = "0.4", default-features = false }
earcutr = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 2

[package.metadata.android]
package_name = "fr.franchiruncap.essaim"
label = "Essaim"
res = "android_res"
icon = "@mipmap/ic_launcher"
fullscreen = true
build_targets = ["armv7-linux-androideabi", "aarch64-linux-android", "x86_64-linux-android"]
min_sdk_version = 21
target_sdk_version = 33

[package.metadata.android.activity_attributes]
"android:screenOrientation" = "fullSensor"
"android:configChanges" = "orientation|screenSize|screenLayout|keyboardHidden"
